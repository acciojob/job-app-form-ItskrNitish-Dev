<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
	<div class="container">
		<h1>Job Application Form</h1>
		<form method="post">
			<div class="main">
				<label for="name">Name:</label>
				<input 
					type="text" 
					id="name" 
					name="name" 
					placeholder="Enter your name" 
					required
				> 
			</div>

			<div class="main">
				<label for="email">Email:</label>
				<input 
					type="email" 
					id="email" 
					name="email" 
					placeholder="Enter your email" 
					required
				> 
			</div>
            <div class="main">
				<label>Gender:</label>
				<div class="radio-btn">
					<input 
					   type="radio" 
					   id="male" 
					   name="gender" 
					   value="Male"
					   required
				    > 
					<label for="male">Male</label>

					<input
                        type="radio"
                        id="female"
                        name="gender"
                        value="Female"
                    >
                    <label for="female">Female</label>

					<input
                        type="radio"
                        id="other"
                        name="gender"
                        value="Other"
                    >
                    <label for="other">Female</label>
				<div/>
			</div>

			<div class="main">
                <label for="laptop">Laptop Brands:</label>

                <select id="laptop" name="laptop">
                    <option value="">Select a laptop brand</option>
                    <option value="Apple">Apple</option>
                    <option value="Asus">Asus</option>
                    <option value="HP">HP</option>
                </select>
            </div>

			<div class="main">
                <label for="age">Age:</label>
                <input
                    type="number"
                    id="age"
                    name="age"
                    placeholder="Enter your age"
                    required
                >
            </div>

			<div class="main">
                <label for="dob">Date of Birth:</label>
                <input
                    type="date"
                    id="dob"
                    name="dob"
                    required
                >
            </div>

			<div class="main">
                <label for="password">Password:</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

			<div class="main">
                <label for="portfolio">Portfolio URL:</label>
                <input
                    type="url"
                    id="portfolio"
                    name="portfolio"
                    placeholder="https://example.com"
                >
            </div>

            <button type="submit">Submit Application</button>
			
			
		</form>
		
	</div>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
